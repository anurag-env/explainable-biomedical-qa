# Data Configuration
# -----------------

datasets:
  pubmedqa:
    name: "PubMedQA"
    source: "bigbio/pubmed_qa"  # Hugging Face dataset ID
    expected_samples:
      artificial: 211300
      unlabeled: 61200
      expert: 1000
      total: 273500
    splits:
      train: 0.8
      val: 0.1
      test: 0.1
    raw_dir: "data/raw/pubmedqa"
    processed_dir: "data/processed/pubmedqa"

  medqa:
    name: "MedQA"
    source: "bigbio/med_qa"  # Hugging Face dataset ID
    github_url: "https://github.com/jind11/MedQA"
    expected_samples: 12723
    splits:
      train: 0.8
      val: 0.1
      test: 0.1
    raw_dir: "data/raw/medqa"
    processed_dir: "data/processed/medqa"

  healthsearchqa:
    name: "HealthSearchQA"
    source: "katielink/healthsearchqa"  # Hugging Face dataset ID
    expected_samples: 4440
    splits:
      train: 0.8
      val: 0.1
      test: 0.1
    raw_dir: "data/raw/healthsearchqa"
    processed_dir: "data/processed/healthsearchqa"

# Unified schema for all datasets
schema:
  fields:
    - question       # The biomedical question
    - context        # PubMed abstract / passage / evidence
    - answer         # Free-text answer
    - label          # Yes / No / Maybe (where applicable)

preprocessing:
  lowercase: false  # Biomedical terms are case-sensitive
  remove_special_chars: false
  max_question_length: 128
  max_context_length: 128
  tokenizer: "allenai/biomed_roberta_base"
